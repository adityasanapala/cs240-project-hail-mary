<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio to Text Converter</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --container-bg: white;
            --text-color: #333;
            --secondary-text: #666;
            --border-color: #ddd;
            --output-bg: #f9f9f9;
            --btn-hover: rgba(0, 0, 0, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.1);
        }
        
        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --secondary-text: #aaaaaa;
            --border-color: #444;
            --output-bg: #2d2d2d;
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--container-bg);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--shadow-color);
            padding: 20px;
            margin-top: 20px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-color);
            transition: color 0.3s ease;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        #startBtn {
            background-color: #4CAF50;
            color: white;
        }
        
        #stopBtn {
            background-color: #f44336;
            color: white;
        }
        
        #clearBtn {
            background-color: #2196F3;
            color: white;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .status {
            text-align: center;
            margin-bottom: 20px;
            color: var(--secondary-text);
            font-style: italic;
            transition: color 0.3s ease;
        }
        
        .text-output {
            min-height: 200px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: var(--output-bg);
            overflow-y: auto;
            line-height: 1.5;
            color: var(--text-color);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        #copyBtn, #downloadBtn {
            background-color: #607D8B;
            color: white;
        }
        
        .language-select {
            margin-bottom: 20px;
            text-align: center;
        }
        
        select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--container-bg);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        
        /* Dark Mode Toggle */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
        }
        
        .theme-toggle-label {
            margin-right: 10px;
            color: var(--text-color);
            transition: color 0.3s ease;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 30px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #2196F3;
        }
        
        input:checked + .slider:before {
            transform: translateX(30px);
        }
        
        .slider:after {
            content: '☀️';
            position: absolute;
            left: 8px;
            top: 5px;
            font-size: 14px;
        }
        
        input:checked + .slider:after {
            content: '🌙';
            left: 35px;
        }
        
        @media (max-width: 600px) {
            .controls, .actions {
                flex-direction: column;
            }
            
            button {
                width: 100%;
                margin-bottom: 10px;
            }
            
            .theme-toggle {
                position: relative;
                top: 0;
                right: 0;
                margin-bottom: 20px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle">
        <span class="theme-toggle-label">Theme:</span>
        <label class="switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
        </label>
    </div>
    
    <h1>Audio to Text Converter</h1>
    
    <div class="container">
        <div class="language-select">
            <label for="language">Select Language: </label>
            <select id="language">
                <option value="en-US">English (US)</option>
                <option value="es-ES">Spanish</option>
                <option value="fr-FR">French</option>
                <option value="de-DE">German</option>
                <option value="it-IT">Italian</option>
                <option value="ja-JP">Japanese</option>
                <option value="zh-CN">Chinese (Simplified)</option>
            </select>
        </div>
        
        <div class="controls">
            <button id="startBtn">Start Recording</button>
            <button id="stopBtn" disabled>Stop Recording</button>
            <button id="clearBtn">Clear Text</button>
        </div>
        
        <div class="status" id="status">Ready to record</div>
        
        <div class="text-output" id="textOutput"></div>
        
        <div class="actions">
            <button id="copyBtn">Copy to Clipboard</button>
            <button id="downloadBtn">Download as Text</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusDiv = document.getElementById('status');
            const textOutput = document.getElementById('textOutput');
            const copyBtn = document.getElementById('copyBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const languageSelect = document.getElementById('language');
            const themeToggle = document.getElementById('themeToggle');
            
            // Theme Toggle
            // Check for saved theme preference or use device preference
            const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");
            
            // Load saved theme or use device preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && prefersDarkScheme.matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.checked = true;
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggle.checked = false;
            }
            
            // Theme toggle event listener
            themeToggle.addEventListener('change', () => {
                if (themeToggle.checked) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light');
                }
            });
            
            // Speech Recognition Setup
            let recognition = null;
            let isRecording = false;
            
            // Initialize Speech Recognition
            function initializeSpeechRecognition() {
                window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                if (!window.SpeechRecognition) {
                    statusDiv.textContent = "Speech recognition not supported in this browser.";
                    startBtn.disabled = true;
                    return false;
                }
                
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = languageSelect.value;
                
                // Speech recognition events
                recognition.onstart = () => {
                    statusDiv.textContent = "Listening...";
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    isRecording = true;
                };
                
                recognition.onend = () => {
                    if (isRecording) {
                        recognition.start();
                    } else {
                        statusDiv.textContent = "Recording stopped.";
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                    }
                };
                
                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';
                    
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    
                    if (finalTranscript) {
                        const p = document.createElement('p');
                        p.textContent = finalTranscript;
                        textOutput.appendChild(p);
                        textOutput.scrollTop = textOutput.scrollHeight;
                    }
                    
                    if (interimTranscript) {
                        let interimElement = document.getElementById('interim');
                        if (!interimElement) {
                            interimElement = document.createElement('p');
                            interimElement.id = 'interim';
                            interimElement.style.color = 'var(--secondary-text)';
                            interimElement.style.fontStyle = 'italic';
                            textOutput.appendChild(interimElement);
                        }
                        interimElement.textContent = interimTranscript;
                        textOutput.scrollTop = textOutput.scrollHeight;
                    }
                };
                
                recognition.onerror = (event) => {
                    statusDiv.textContent = `Error occurred: ${event.error}`;
                    isRecording = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                };
                
                return true;
            }
            
            // Event Listeners
            startBtn.addEventListener('click', () => {
                if (!recognition) {
                    if (!initializeSpeechRecognition()) return;
                }
                
                recognition.lang = languageSelect.value;
                recognition.start();
                isRecording = true;
            });
            
            stopBtn.addEventListener('click', () => {
                if (recognition) {
                    isRecording = false;
                    recognition.stop();
                    statusDiv.textContent = "Recording stopped.";
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    
                    // Remove interim results
                    const interimElement = document.getElementById('interim');
                    if (interimElement) interimElement.remove();
                }
            });
            
            clearBtn.addEventListener('click', () => {
                textOutput.innerHTML = '';
                statusDiv.textContent = "Text cleared.";
            });
            
            copyBtn.addEventListener('click', () => {
                const text = getAllText();
                if (text) {
                    navigator.clipboard.writeText(text)
                        .then(() => {
                            statusDiv.textContent = "Text copied to clipboard!";
                            setTimeout(() => {
                                statusDiv.textContent = isRecording ? "Listening..." : "Ready to record";
                            }, 2000);
                        })
                        .catch(err => {
                            statusDiv.textContent = "Failed to copy text.";
                            console.error('Could not copy text: ', err);
                        });
                } else {
                    statusDiv.textContent = "No text to copy.";
                }
            });
            
            downloadBtn.addEventListener('click', () => {
                const text = getAllText();
                if (text) {
                    const blob = new Blob([text], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'speech-to-text.txt';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    statusDiv.textContent = "Text downloaded!";
                } else {
                    statusDiv.textContent = "No text to download.";
                }
            });
            
            languageSelect.addEventListener('change', () => {
                if (recognition) {
                    const wasRecording = isRecording;
                    
                    if (wasRecording) {
                        isRecording = false;
                        recognition.stop();
                    }
                    
                    recognition.lang = languageSelect.value;
                    
                    if (wasRecording) {
                        setTimeout(() => {
                            recognition.start();
                            isRecording = true;
                        }, 200);
                    }
                    
                    statusDiv.textContent = `Language changed to ${languageSelect.options[languageSelect.selectedIndex].text}`;
                }
            });
            
            // Helper function to get all text
            function getAllText() {
                const paragraphs = textOutput.querySelectorAll('p:not(#interim)');
                if (paragraphs.length === 0) return '';
                
                return Array.from(paragraphs)
                    .map(p => p.textContent)
                    .join('\n');
            }
            
            // Initialize speech recognition
            initializeSpeechRecognition();
        });
    </script>
</body>
</html>
